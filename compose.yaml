name: mailforwarder

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: mailforwarder-php
    container_name: mailforwarder-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-mailforwarder}
      DB_USERNAME: ${MYSQL_USER:-mailforwarder}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mailforwarder_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FORWARD_CAPTURE_DSN: smtp://mailpit:1025
      APP_URL: http://localhost:${HTTP_PORT:-28090}
      APP_TIMEZONE: Europe/Budapest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mailforwarder

  nginx:
    image: nginx:alpine
    container_name: mailforwarder-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-28090}:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - frontend
    networks:
      - mailforwarder

  frontend:
    image: node:24-alpine
    container_name: mailforwarder-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: /api
      VITE_HMR_CLIENT_PORT: ${HTTP_PORT:-28090}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5175"
    depends_on:
      - app
    networks:
      - mailforwarder

  mysql:
    image: mysql:8.0
    container_name: mailforwarder-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mailforwarder}
      MYSQL_USER: ${MYSQL_USER:-mailforwarder}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mailforwarder_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mailforwarder_root}
    ports:
      - "${MYSQL_PORT:-23307}:3306"
    volumes:
      - mailforwarder_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-mailforwarder_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mailforwarder

  redis:
    image: redis:alpine
    container_name: mailforwarder-redis
    restart: unless-stopped
    volumes:
      - mailforwarder_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mailforwarder

  scheduler:
    image: mailforwarder-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mailforwarder-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-mailforwarder}
      DB_USERNAME: ${MYSQL_USER:-mailforwarder}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mailforwarder_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      APP_TIMEZONE: Europe/Budapest
      FORWARD_CAPTURE_DSN: smtp://mailpit:1025
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mailforwarder

  queue:
    image: mailforwarder-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mailforwarder-queue
    restart: unless-stopped
    working_dir: /var/www
    stop_grace_period: 2m
    command: php artisan queue:work redis --queue=forwarding --sleep=1 --tries=3 --timeout=90 --backoff=15,60,180
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-mailforwarder}
      DB_USERNAME: ${MYSQL_USER:-mailforwarder}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mailforwarder_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_QUEUE_RETRY_AFTER: 120
      APP_TIMEZONE: Europe/Budapest
      FORWARD_CAPTURE_DSN: smtp://mailpit:1025
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mailforwarder

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailforwarder-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-28029}:8025"
      - "${MAILPIT_SMTP_PORT:-21031}:1025"
    networks:
      - mailforwarder

networks:
  mailforwarder:
    name: mailforwarder

volumes:
  mailforwarder_mysql:
  mailforwarder_redis:
  frontend_node_modules:
