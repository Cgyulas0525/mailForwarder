name: mailforwarder

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: mailforwarder-php-prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:${HTTP_PORT:-28090}
      APP_TIMEZONE: Europe/Budapest
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-mailforwarder}
      DB_USERNAME: ${MYSQL_USER:-mailforwarder}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mailforwarder_password}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      FORWARD_LIVE_SMTP: ${FORWARD_LIVE_SMTP:-false}
      FORWARD_CAPTURE_DSN: smtp://mailpit:1025
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [mailforwarder]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-28090}:80"
    depends_on: [app]
    networks: [mailforwarder]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mailforwarder}
      MYSQL_USER: ${MYSQL_USER:-mailforwarder}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mailforwarder_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mailforwarder_root}
    volumes: [mailforwarder_mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-mailforwarder_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mailforwarder]

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes: [mailforwarder_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mailforwarder]

  scheduler:
    image: mailforwarder-php-prod
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_TIMEZONE: Europe/Budapest
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${MYSQL_DATABASE:-mailforwarder}
      DB_USERNAME: ${MYSQL_USER:-mailforwarder}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mailforwarder_password}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mailforwarder]

  queue:
    image: mailforwarder-php-prod
    restart: unless-stopped
    stop_grace_period: 2m
    command: php artisan queue:work redis --queue=forwarding --sleep=1 --tries=3 --timeout=90 --backoff=15,60,180
    environment:
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${MYSQL_DATABASE:-mailforwarder}
      DB_USERNAME: ${MYSQL_USER:-mailforwarder}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mailforwarder_password}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_QUEUE_RETRY_AFTER: 120
      FORWARD_LIVE_SMTP: ${FORWARD_LIVE_SMTP:-false}
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mailforwarder]

networks:
  mailforwarder:
    name: mailforwarder

volumes:
  mailforwarder_mysql:
  mailforwarder_redis:
